name: Publish release

# The private build pushes one release's files to the `incoming` branch; this turns them into a GitHub Release.
on:
  push:
    branches: [incoming]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incoming
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v already published"; exit 0; fi
          gh release create "v$v" UsageBar_*_x64-setup.exe UsageBar_*_x64-setup.exe.sig latest.json \
            --title "UsageBar $v" --notes-file NOTES.md --target main --latest
      - name: Clear incoming branch
        run: |
          git config user.name "usagebar-ci"; git config user.email "usagebar-ci@users.noreply.github.com"
          git checkout -q --orphan empty && git rm -rqf . && git commit -q --allow-empty -m "empty"
          git push -qf origin empty:incoming
